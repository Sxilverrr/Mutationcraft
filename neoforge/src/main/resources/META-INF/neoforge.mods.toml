modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://www.curseforge.com/minecraft/mc-mods/mutationcraft"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/mutationcraft"
authors = "ASEStefan, Sxilverr"
credits = "Artists: songsofsorrow & Jordaan"
description = "Adds new mutant creatures into the game."
logoFile = "logo.png"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "geckolib"
type = "required"
versionRange = "${geckolib_range}"
ordering = "AFTER"
side = "BOTH"
